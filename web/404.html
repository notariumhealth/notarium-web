<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Notarium</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=cormorant-garamond:300,400,600|inter:300,400,500&display=swap">
  <style>
    :root {
      --bg: #0D1117;
      --border: #1E2535;
      --text: #EEE9E2;
      --muted: #7A7E8D;
      --accent: #4A9585;
      --accent-hover: #5BB8A4;
      --font-display: "Cormorant Garamond", Georgia, serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .wrap {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 28px;
      padding-bottom: 28px;
    }

    .nav-logo {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .nav-logo-dot { color: var(--accent); }

    .tm { font-size: 0.5em; font-weight: 400; vertical-align: super; }

    .nav-right { display: flex; align-items: center; gap: 28px; }

    .nav-link {
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-link:hover { color: var(--accent-hover); }

    main { flex: 1 0 auto; display: flex; align-items: center; }

    .notfound {
      padding: 80px 0 96px;
      max-width: 560px;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .notfound h1 {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(40px, 8vw, 68px);
      line-height: 1.03;
      color: var(--text);
      margin-bottom: 24px;
    }

    .notfound p {
      font-size: 19px;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .btn-primary {
      display: inline-block;
      background: var(--accent);
      color: var(--bg);
      font-size: 16px;
      font-weight: 500;
      padding: 14px 28px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .footer {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px 32px;
      padding-top: 40px;
      padding-bottom: 48px;
      border-top: 1px solid var(--border);
    }

    .footer-logo {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 22px;
      color: var(--muted);
    }

    .footer-nav { display: flex; flex-wrap: wrap; gap: 20px; }

    .footer-nav a {
      color: var(--accent);
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover { color: var(--accent-hover); }

    .footer-copy {
      font-size: 13px;
      color: var(--muted);
      flex-basis: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <nav class="nav">
      <a class="nav-logo" href="/" aria-label="Notarium home">Notarium<span class="tm">&trade;</span><span class="nav-logo-dot">.</span></a>
      <div class="nav-right">
        <a class="nav-link" href="/about">About</a>
        <a class="nav-link" href="/#waitlist">Get early access &rarr;</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    <section class="notfound">
      <p class="eyebrow">404</p>
      <h1>Page not found.</h1>
      <p>That page is not here. It may have moved, or the link may be wrong.</p>
      <a class="btn-primary" href="/">Go to the homepage</a>
    </section>
  </main>

  <footer class="wrap footer">
    <span class="footer-logo">Notarium</span>
    <nav class="footer-nav" aria-label="Legal and source">
      <a href="/security">Security</a>
      <a href="https://github.com/notariumhealth">GitHub</a>
      <a href="https://codeberg.org/notariumhealth">Codeberg</a>
    </nav>
    <span class="footer-copy">&copy; 2026 Notarium LLC. Notarium&trade; is a trademark of Notarium LLC.</span>
  </footer>
</body>
</html>
